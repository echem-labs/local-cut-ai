# Local gates, so CI is not the thing that tells you about a missing newline.
#
# Actions minutes are metered while this repo is private (see the matrix note
# in .github/workflows/ci-engine.yml), and lint is the cheapest possible
# reason to spend them. These hooks are worth keeping after the repo goes
# public regardless: the feedback is seconds instead of minutes.
#
# Install:  uv run --project engine pre-commit install
# Bypass:   git commit --no-verify  /  git push --no-verify
#
# Every hook is `repo: local` on purpose. The obvious alternative — pinning
# astral-sh/ruff-pre-commit — writes the ruff version down a second time, in
# a file that has no relationship to engine/uv.lock. When the two drift, the
# hook formats code one way and CI checks it another, and the failure surfaces
# as a red build on code that passed locally. Running the project's own ruff
# through uv makes that class of drift impossible.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      # --- on commit: fast enough that you do not notice it -------------
      # These carry no `stages:`, so they also run again on push — which is
      # the point, since it is the one thing that still catches code that was
      # committed with --no-verify.
      - id: ruff-check
        name: ruff check (engine)
        entry: uv run --project engine ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        files: ^engine/
        require_serial: true

      - id: ruff-format
        name: ruff format (engine)
        entry: uv run --project engine ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^engine/
        require_serial: true

      # --- on push: the same verdict CI would give ----------------------
      # Now that CI runs Ubuntu-only, these are very nearly the whole of it.
      # A green pre-push on Linux means a green CI run, so the remaining
      # reason to spend a runner is the record, not the discovery.
      #
      # `pass_filenames: false` because these are suite-level commands, but
      # `files:` still gates them — a desktop-only push does not run pytest.
      #
      - id: engine-tests
        name: engine tests (pytest)
        entry: bash -c 'cd engine && uv run pytest -q -rs'
        language: system
        files: ^engine/
        pass_filenames: false
        stages: [pre-push]

      # A handful of files outside engine/ are asserted against BY an engine
      # test — the CLI-name contract reads the desktop's spawn path, the
      # package guard, the electron-builder copy path, the remote-engine hint
      # and the release matrix. A gate that omits them lets the one edit that
      # test exists to catch through untested, which is why ci-engine.yml's
      # path filter names them too; keep the two lists in step.
      #
      # Its own hook rather than a wider `files:` on the one above: Settings
      # .tsx is an ordinary desktop file that gets edited often, and making
      # every touch of it pay the whole engine suite is how a pre-push hook
      # becomes something people reach for --no-verify to get around. This
      # runs the one test that reads these files, in well under a second.
      - id: cli-name-contract
        name: CLI name contract (pytest)
        entry: bash -c 'cd engine && uv run pytest -q tests/test_cli_name.py'
        language: system
        files: |
          (?x)^(
            \.github/workflows/package\.yml
            |apps/desktop/electron-builder\.yml
            |apps/desktop/electron/engine\.ts
            |apps/desktop/scripts/check-engine\.mjs
            |apps/desktop/src/screens/Settings\.tsx
          )
        pass_filenames: false
        stages: [pre-push]

      # Same reasoning, different test: test_ui_contract.py is the only thing
      # that compares the desktop's constants with the engine's, and the
      # desktop suite cannot do it (it runs against TypeScript alone). The
      # kind list moved from screens/Home.tsx into lib/tools.ts, so a PR that
      # drops a shipped tool now touches apps/desktop/** only — which runs
      # vitest and tsc, neither of which knows what the engine ships.
      - id: ui-contract
        name: Python/TS constant contract (pytest)
        entry: bash -c 'cd engine && uv run pytest -q tests/test_ui_contract.py'
        language: system
        files: |
          (?x)^apps/desktop/src/(
            lib/(formats|tools)\.ts
            |api/(client|types)\.ts
            |i18n/en/(status|notices|tools|project)\.json
          )$
        pass_filenames: false
        stages: [pre-push]

      # Third reader of files outside engine/, and the only one whose inputs
      # are at the repository root. LICENSE, NOTICE, README.md and CONTRIBUTING.md match no
      # other hook here at all; package.json runs the desktop hooks, which
      # cannot read a licence. Same shape as the two above -- one test, in
      # well under a second, rather than the whole engine suite.
      - id: license-contract
        name: licence contract (pytest)
        entry: bash -c 'cd engine && uv run pytest -q tests/test_license_contract.py'
        language: system
        files: |
          (?x)^(
            LICENSE
            |NOTICE
            |README\.md
            |CONTRIBUTING\.md
            |apps/desktop/package\.json
          )$
        pass_filenames: false
        stages: [pre-push]

      - id: desktop-typecheck
        name: desktop typecheck (tsc)
        entry: bash -c 'cd apps/desktop && npm run typecheck'
        language: system
        files: ^apps/desktop/
        pass_filenames: false
        stages: [pre-push]

      # branding/ as well as apps/desktop/: BrandMark.test.tsx compares the
      # on-screen mark against branding/logo.svg, so a commit touching only
      # the SVG is exactly the one that test exists to catch. ci-desktop.yml's
      # path filter names it for the same reason; keep the two lists in step.
      - id: desktop-tests
        name: desktop tests (vitest)
        entry: bash -c 'cd apps/desktop && npm test'
        language: system
        files: ^(apps/desktop/|branding/)
        pass_filenames: false
        stages: [pre-push]

      # Its own hook rather than folding into the two above: this runs in a
      # quarter of a second, and it is the guard for the one thing neither of
      # them can see — the committed icon BINARIES, which are what ship, going
      # stale against the SVG they are rendered from. Gated on the generator
      # and its inputs and outputs, so an ordinary desktop edit does not pay it.
      - id: icon-check
        name: app icons match branding/logo.svg
        entry: bash -c 'cd apps/desktop && npm run icon:check'
        language: system
        files: |
          (?x)^(
            branding/logo\.svg
            |apps/desktop/scripts/make-icon\.mjs
            |apps/desktop/(build|public)/icon(-mac)?\.(png|ico|icns)
          )$
        pass_filenames: false
        stages: [pre-push]
