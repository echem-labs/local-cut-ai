# electron-builder config — packages the desktop shell together with the
# frozen engine (built first via `uv run pyinstaller` in engine/, see
# engine/localcut.spec). Output lands in apps/desktop/release/.
appId: ai.localcut.desktop
productName: LocalCut AI
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  # Renderer deps are bundled by Vite and the main process only uses
  # electron + node builtins — no runtime node_modules needed.
  - "!node_modules"
extraResources:
  # PyInstaller onedir output → resources/engine/localcut[.exe]
  # (spawned by dist-electron/electron/engine.js when app.isPackaged).
  # Freeze the engine ON the target OS first — PyInstaller doesn't cross-
  # compile, so a Linux package needs the engine frozen on Linux.
  - from: ../../engine/dist/localcut
    to: engine
asar: true
npmRebuild: false
win:
  # Cut-Play mark — generated from branding/logo.svg by scripts/make-icon.mjs
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
mac:
  # NO arch list here on purpose. extraResources copies ONE PyInstaller
  # output, and PyInstaller does not cross-compile — so listing both arches
  # would build two dmgs from a single freeze and stamp (say) the arm64
  # engine into the Intel one. That dmg installs, launches, and never
  # connects. The arch comes from the CLI instead (`--arm64` / `--x64`, see
  # the package:mac* scripts), so each build states which freeze it is
  # packaging and check-engine.mjs verifies the Mach-O cputype matches.
  icon: build/icon.icns
  category: public.app-category.video
  target:
    - dmg
  # Hardened runtime + entitlements, or Gatekeeper refuses to exec the
  # bundled PyInstaller engine at all — the app would launch and then sit
  # permanently disconnected, with the real cause buried in Console.app.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing identity comes from the environment (CSC_LINK / CSC_KEY_PASSWORD)
  # so no developer certificate is baked into the repo. An unsigned local
  # build still works for `--dir` testing.
  notarize: false
dmg:
  writeUpdateInfo: false

# The AppImage's runtime, the small program at the front of the file that
# mounts the rest. electron-builder's default (0.0.0) is the legacy runtime,
# which dlopens libfuse.so.2 - and Ubuntu has not installed libfuse2 since
# 22.04. There it prints "dlopen(): error loading libfuse.so.2" to a terminal
# nobody has open and exits, so a double-clicked AppImage does nothing at
# all. 1.0.3 is the static type2 runtime, which carries its own FUSE and
# mounts through the fusermount3 every current desktop has.
# electron/appImageRuntime.test.ts holds this, and package.yml checks the
# runtime of the AppImage it builds.
toolsets:
  appimage: "1.0.3"

linux:
  icon: build/icon.png
  category: AudioVideo
  # Keep WM_CLASS in sync with the .desktop entry so desktop environments
  # associate running windows with the launcher (dock icons, alt-tab).
  syncDesktopName: true
  # AppImage runs on any distro; deb serves apt-based installs (the dev/test
  # baseline is Ubuntu). ffmpeg is NOT bundled: the engine locates one via
  # LOCALCUT_FFMPEG_BIN/PATH, and /system's ffmpeg_drawtext flag tells the
  # UI when that build can't burn titles or captions in (a build without
  # libass).
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  synopsis: Local-first AI video generation
deb:
  # This list replaces electron-builder's default instead of adding to it.
  # The first nine are that default. It leaves out two libraries Electron's
  # binary links directly, and a bare Ubuntu 22.04 has neither: without
  # them the installed app exits in the dynamic loader before it opens a
  # window. libgbm1 provides libgbm.so.1, and ALSA's package libasound.so.2.
  #
  # ALSA is named twice because Ubuntu renamed it in 24.04. There
  # libasound2t64 is the library and libasound2 only a name two packages
  # provide, and apt picks the other one, liboss4-salsa-asound2: an OSS shim
  # without ALSA's versioned symbols, which stops the app at
  # "undefined symbol: snd_device_name_get_hint, version ALSA_0.9". 22.04
  # has no libasound2t64 and takes the second name, its own libasound2.
  #
  # package.yml installs the deb in the bare 22.04 build container and
  # starts it; electron/debDepends.test.ts holds both entries.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - "libasound2t64 | libasound2"
