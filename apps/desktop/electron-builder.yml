# electron-builder config — packages the desktop shell together with the
# frozen engine (built first via `uv run pyinstaller` in engine/, see
# engine/localcut.spec). Output lands in apps/desktop/release/.
appId: ai.localcut.desktop
productName: LocalCut AI
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  # Renderer deps are bundled by Vite and the main process only uses
  # electron + node builtins — no runtime node_modules needed.
  - "!node_modules"
extraResources:
  # PyInstaller onedir output → resources/engine/localcut[.exe]
  # (spawned by dist-electron/electron/engine.js when app.isPackaged).
  # Freeze the engine ON the target OS first — PyInstaller doesn't cross-
  # compile, so a Linux package needs the engine frozen on Linux.
  - from: ../../engine/dist/localcut
    to: engine
asar: true
npmRebuild: false
win:
  # Cut-Play mark — generated from branding/logo.svg by scripts/make-icon.mjs
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
mac:
  # NO arch list here on purpose. extraResources copies ONE PyInstaller
  # output, and PyInstaller does not cross-compile — so listing both arches
  # would build two dmgs from a single freeze and stamp (say) the arm64
  # engine into the Intel one. That dmg installs, launches, and never
  # connects. The arch comes from the CLI instead (`--arm64` / `--x64`, see
  # the package:mac* scripts), so each build states which freeze it is
  # packaging and check-engine.mjs verifies the Mach-O cputype matches.
  icon: build/icon.icns
  category: public.app-category.video
  target:
    - dmg
  # Hardened runtime + entitlements, or Gatekeeper refuses to exec the
  # bundled PyInstaller engine at all — the app would launch and then sit
  # permanently disconnected, with the real cause buried in Console.app.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing identity comes from the environment (CSC_LINK / CSC_KEY_PASSWORD)
  # so no developer certificate is baked into the repo. An unsigned local
  # build still works for `--dir` testing.
  notarize: false
dmg:
  writeUpdateInfo: false

linux:
  icon: build/icon.png
  category: AudioVideo
  # Keep WM_CLASS in sync with the .desktop entry so desktop environments
  # associate running windows with the launcher (dock icons, alt-tab).
  syncDesktopName: true
  # AppImage runs on any distro; deb serves apt-based installs (the dev/test
  # baseline is Ubuntu). ffmpeg is NOT bundled: the engine locates one via
  # LOCALCUT_FFMPEG_BIN/PATH, and /system's ffmpeg_drawtext flag tells the
  # UI when that build can't render on-screen titles (FFmpeg 7 static
  # builds without libharfbuzz).
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  synopsis: Local-first AI video generation
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
