name: Package

# Building an installer is slow and macOS runners bill at a premium, so this
# does NOT run on every push. It runs on a release tag and on demand.
#
# It used to also run on any PR touching the packaging path, on the reasoning
# that that is the only time packaging can break unnoticed. That is still
# true, but the price was wrong: one run is ~65 billable minutes (150 of them
# macOS, at the 10x private-repo multiplier), it fired six times in July 2026,
# and it was ~11% of a 2,000-minute allowance the account then ran out of.
# `workflow_dispatch` covers the same ground at a moment of your choosing —
# run it by hand on a packaging PR before merging.
#
# Once the repo is public, minutes on standard runners are free and the
# paths-based `pull_request` trigger above is worth restoring; it is kept
# here, commented, so the path list does not have to be reconstructed.
#
# Minutes are not the only meter. A private repo also gets 0.5 GB of Actions
# ARTIFACT storage, and one run of this workflow produces ~860 MB — the Linux
# job alone is 485 MB, because the AppImage and the deb each embed their own
# copy of the frozen engine. Four runs in July 2026 left 3.1 GB sitting at
# the then-default 14-day retention and put the account at 90% of the storage
# allowance five days into the next cycle, having run nothing that cycle at
# all. Retention below is therefore counted in days, and a tag build copies
# the installers onto the release, whose assets are not metered as Actions
# storage. Do not raise `retention-days` to keep a build around — cut a tag,
# or re-run this workflow.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  # pull_request:
  #   paths:
  #     - "apps/desktop/electron-builder.yml"
  #     - "apps/desktop/package.json"
  #     - "apps/desktop/scripts/check-engine.mjs"
  #     - "apps/desktop/scripts/make-icon.mjs"
  #     - "apps/desktop/build/**"
  #     - "apps/desktop/public/**"
  #     - "branding/**"
  #     - "engine/localcut.spec"
  #     - "engine/packaging/**"
  #     - ".github/workflows/package.yml"

# Only a pull_request run is safe to cancel. A tag push is a release build —
# `github.ref` is refs/tags/v… there, so a "not main" test would treat it as
# cancellable and let a second tag (or a re-tag) kill the build that produces
# the artifact people install.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    # One installer per platform, each frozen on the platform it targets.
    # PyInstaller does not cross-compile, so the engine and the installer
    # around it are a single decision — which is also why macOS names an
    # arch: macos-latest is arm64, and an Intel dmg needs this same job on an
    # Intel runner with `package:mac:x64`.
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One platform failing must not hide the state of the other two — the
      # whole point of packaging in CI is to see every target at once.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS dmg (arm64)
            script: package:mac
            engine_bin: dist/localcut/localcut
            artifact: localcut-macos-arm64
            glob: |
              apps/desktop/release/*.dmg
          - os: windows-latest
            label: Windows installer (x64)
            script: package
            engine_bin: dist/localcut/localcut.exe
            artifact: localcut-windows-x64
            glob: |
              apps/desktop/release/*.exe
          - os: ubuntu-latest
            label: Linux AppImage + deb (x64)
            script: package:linux
            engine_bin: dist/localcut/localcut
            artifact: localcut-linux-x64
            glob: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
    # bash everywhere, including Windows, so the steps below are one script
    # rather than three dialects.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # --group build pulls PyInstaller, which the test job does not need.
      - name: Freeze the engine
        working-directory: engine
        run: |
          uv sync --all-groups
          uv run pyinstaller --noconfirm localcut.spec

      - name: Nothing unlicensed ships in the freeze
        # The one place this can be asked. Every other licence guard scans
        # site-packages, and about half of what the freeze carries is resolved
        # from the build machine by PyInstaller's dependency walk rather than
        # from any wheel, so no scan of the closure can reach them: libstdc++,
        # libgcc_s and glibc's libmvec ship this way today, all three carrying
        # copyleft terms. The artifact only exists here, and this job is what
        # redistributes it.
        #
        # `-m freeze`, not the whole module: the rest of it is the closure
        # guard, whose inventories are POSIX-spelled and were only ever
        # validated on Linux (ci-engine is ubuntu-only). Running the file would
        # fail the macOS and Windows legs on `libavcodec` vs `avcodec-62.dll`,
        # here, before the installer is built - so the dmg and the exe would
        # never be produced and `release` would never run.
        working-directory: engine
        env:
          # Turns the guard's skip into a failure. `dist/` exists by now, so a
          # tree it cannot find means PyInstaller's layout moved - and a licence
          # guard that skips in the job that redistributes the artifact reports
          # success having inspected nothing.
          LOCALCUT_CHECK_FROZEN_ENGINE: "1"
        run: uv run pytest tests/test_license_boundaries.py -q -rs -m freeze

      - name: The frozen engine actually runs
        # An installer whose engine cannot start is the exact failure this
        # target exists to prevent, and it is invisible until someone
        # installs the app. `--version` is the cheapest proof of life.
        working-directory: engine
        run: ./${{ matrix.engine_bin }} --version

      - name: Build the installer
        working-directory: apps/desktop
        env:
          # No signing identity on CI. Left to auto-discovery, electron-builder
          # hunts the keychain, finds nothing, and fails the build — rather
          # than producing the unsigned artifact we actually want here.
          # Signed builds set CSC_LINK/CSC_KEY_PASSWORD and drop this.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          # Before the installer, not after: these are the icons about to be
          # stamped into the exe and the bundle, and ci-desktop runs on pull
          # requests only. A tag build is the last point at which committed
          # icons that no longer match branding/logo.svg can still be caught.
          npm run icon:check
          # Same argument, same last point. The attribution list is collected
          # at build time from whatever node_modules this runner installed,
          # and a collector that degrades produces an installer that ships
          # license notices for only some of what is inside it. Nothing in
          # `vite build` fails when that happens - this is the check that does.
          npm run notices:check
          npm run ${{ matrix.script }}

      - name: Show what was produced
        working-directory: apps/desktop
        run: ls -lh release/ | grep -vE "^total|builder-debug|\.blockmap$" || ls -lh release/

      # Two days, not two weeks. See the storage note at the top of the file:
      # this is the handoff to whoever dispatched the run, or to the release
      # job below — not a place installers live. Download it the day you ask
      # for it.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
          retention-days: 2

  release:
    # Tag builds only, and only once every platform is green — a release
    # missing one of its three installers is worse than a late one, which is
    # why this needs the whole matrix despite `fail-fast: false` above.
    #
    # The installers land on the release rather than staying artifacts
    # because release assets are not metered as Actions storage, and because
    # a release is where someone looking for a download will actually go.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The one job here that writes anything back. Scoped to this job rather
    # than the workflow so a dispatch build — which anyone with write access
    # can start, on any ref — runs with a read-only token.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          # Flatten the three per-platform artifacts into one directory; the
          # names only ever have to be unique per artifact, and `gh release
          # upload` takes files, not trees.
          merge-multiple: true

      - name: Attach the installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lh installers/
          # Draft, so cutting a tag never publishes a download on its own —
          # these builds are unsigned until the code-signing work lands,
          # and that is a decision for a person, not for a push.
          # Re-tagging an existing release tops up its assets instead of
          # failing on the create.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" installers/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" installers/* \
              --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi
