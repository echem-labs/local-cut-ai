name: Secret scan

# A one-time audit before going public proves the history was clean on one
# day. It says nothing about the next push, and on a public repository the
# window between a leaked credential and someone else reading it is measured
# in minutes. This is the durable half of that audit.
#
# The gitleaks BINARY, not gitleaks-action. The action refuses to run for any
# organization-owned repository without a paid licence key -- and that gate is
# on the org, not on visibility, so going public does not lift it. The scanner
# itself is MIT and free. Running it directly also drops a third-party action
# from the supply chain of a workflow whose whole job is supply-chain hygiene.
#
# Pinned to a release and verified by checksum before it is executed: a scan
# that silently ran a swapped binary is worse than no scan, because it reports
# success. The rest of this file is the same argument applied to the scanner's
# other inputs -- its rule set, and the history it is pointed at. Each is a
# lever that turns the scan into a green no-op, and none of them is louder
# than the checksum was.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because a rule set that has learned a new provider's key format
    # should get to re-read history without waiting for someone to push.
    - cron: "17 4 * * 1"

# The pair the other four workflows carry, for the reason ci-engine.yml gives:
# a branch pushed three times otherwise runs three full scans, and the two
# already-irrelevant verdicts still finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Renovate bumps the version; the checksum has to move in the same commit,
  # and the fetch step fails loudly rather than silently running an unverified
  # binary if it does not. A scanner pinned in a file nothing watches is a
  # scanner that quietly stops learning new key formats.
  #
  # The annotation has to sit on the line directly above the variable it
  # names. The built-in github-actions manager does not read env annotations
  # at all; what does is the `customManagers:githubActionsVersions` preset,
  # enabled in renovate.json, whose pattern matches the comment and the
  # `*_VERSION:` line with `\s+` between them - so prose in that gap silently
  # stops it matching, and the pin never moves again.
  #
  # gitleaks tags its releases `v8.30.1` while this value and the URL below
  # both spell it bare, so renovate.json strips the prefix for this dependency
  # and keeps it out of the shared minor-and-patch group: a bump that carries
  # a stale checksum should fail on its own branch, not on everyone else's.
  # renovate: datasource=github-releases depName=gitleaks/gitleaks
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: no secrets in the history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans commits, not the worktree. A shallow clone would
          # scan almost nothing and still pass -- which the step below is what
          # actually enforces, because a comment cannot fail a build.
          fetch-depth: 0
          # This job downloads and executes a binary from outside the repo,
          # so the token checkout would otherwise leave in .git/config has no
          # reason to still be there when it runs. Nothing here pushes.
          persist-credentials: false

      - name: Fetch gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Check what the scan is about to run against
        run: |
          set -euo pipefail
          # Three ways this job reports success having proved nothing. The
          # scanner does all of them silently, and none is visible in a green
          # check, so they are asserted here rather than described. Every
          # annotation goes to stdout: workflow commands are read from there,
          # and on stderr this prints as ordinary red log text with no
          # annotation on the file it names.
          #
          # 1. A rule set committed to the tree. gitleaks' config precedence
          #    puts `(target path)/.gitleaks.toml` above its built-in rules,
          #    and a pull_request build checks out the PR's own tree -- so one
          #    file holding `[allowlist] paths = ['''.*''']` turns every rule
          #    off in the same commit that adds a credential, and both scans
          #    below then report "no leaks found" and exit 0. Refusing the
          #    file leaves the built-in rules in force, which is what lets a
          #    version bump teach this job new key formats; pinning `--config`
          #    at some in-repo path would freeze the rules instead.
          for candidate in .gitleaks.toml gitleaks.toml; do
            if [ -e "$candidate" ]; then
              echo "::error file=$candidate::$candidate overrides the scanner's rule set. This job runs the built-in rules on purpose."
              exit 1
            fi
          done
          # 2. The same rule set through the environment instead of the tree.
          #    `--config` is the highest precedence, then $GITLEAKS_CONFIG (a
          #    path, which may sit anywhere, including outside the checkout),
          #    then $GITLEAKS_CONFIG_TOML (the rules inline). Each turns both
          #    scans below into "scanned ~0 bytes ... no leaks found", exit 0,
          #    and the refusal above never sees a file. This job passes no
          #    --config, so the env vars are the whole of the remaining lever.
          for lever in GITLEAKS_CONFIG GITLEAKS_CONFIG_TOML; do
            if [ -n "${!lever:-}" ]; then
              echo "::error::$lever is set, which replaces the scanner's built-in rules. This job runs them on purpose."
              exit 1
            fi
          done
          # 3. A shallow clone. `gitleaks git` exits 0 after scanning zero
          #    commits, so if fetch-depth is ever dropped -- or a checkout
          #    default changes -- the job goes green having read nothing.
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::the checkout is shallow, so the history scan would pass having read almost none of it"
            exit 1
          fi

      - name: Scan the full history
        run: |
          set -euo pipefail
          # The whole history every time: it takes about three seconds here,
          # and scanning only the new commits would let a finding introduced
          # while a rule did not yet exist stay hidden forever.
          #
          # --log-opts re-supplies gitleaks' own defaults (-p -U0
          # --full-history --all), because the flag replaces them wholesale
          # rather than adding to them, and appends --diff-merges=first-parent.
          # Without that, `git log -p` emits no patch for a merge commit, so a
          # secret written while resolving a conflict -- content that is in
          # neither parent -- appears in no scanned diff while staying
          # permanently readable at that commit. This history is merge-based,
          # so that is not a rare shape here: the merges are an eighth of it,
          # and every one of them is a commit the scan would otherwise skip.
          # (No count in prose: the scan prints the real one every run.)
          #
          # --ignore-gitleaks-allow: a `gitleaks:allow` comment is a
          # suppression anyone can add in the same diff as the secret it
          # suppresses, leaving no trail anywhere a reviewer looks.
          # .gitleaksignore is the reviewed way to dismiss a finding, and its
          # header says what an entry there is claiming.
          #
          # --redact so a real finding is not republished in the log of a
          # public repository, which would be the second disclosure.
          ./gitleaks git --no-banner --redact --exit-code 1 \
            --ignore-gitleaks-allow \
            --log-opts "-p -U0 --full-history --all --diff-merges=first-parent" \
            .

      - name: Scan the working tree
        run: |
          set -euo pipefail
          # Catches anything reachable in the checkout that is not a committed
          # blob -- and fails on a submodule or generated file a history scan
          # would step over.
          ./gitleaks dir --no-banner --redact --exit-code 1 \
            --ignore-gitleaks-allow \
            .
