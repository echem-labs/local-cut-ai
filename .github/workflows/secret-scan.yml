name: Secret scan

# A one-time audit before going public proves the history was clean on one
# day. It says nothing about the next push, and a public repository is a
# repository where the window between a leaked credential and someone else
# reading it is measured in minutes. This is the durable half of that audit.
#
# Runs over the PR's own commits rather than the whole history: the full
# 700-commit scan takes ~3s, but scoping it to what is being added is what
# makes the failure message point at the commit that has to be fixed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because a rule set that has learned a new provider's key format
    # should get a chance to re-read history without waiting for a push.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: no secrets in the diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks needs history to scan commits rather than the worktree;
          # a shallow clone silently scans almost nothing.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          # No org licence key is needed for a public repository.
