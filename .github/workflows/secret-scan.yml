name: Secret scan

# A one-time audit before going public proves the history was clean on one
# day. It says nothing about the next push, and on a public repository the
# window between a leaked credential and someone else reading it is measured
# in minutes. This is the durable half of that audit.
#
# The gitleaks BINARY, not gitleaks-action. The action refuses to run for any
# organization-owned repository without a paid licence key -- and that gate is
# on the org, not on visibility, so going public does not lift it. The scanner
# itself is MIT and free. Running it directly also drops a third-party action
# from the supply chain of a workflow whose whole job is supply-chain hygiene.
#
# Pinned to a release and verified by checksum before it is executed: a scan
# that silently ran a swapped binary is worse than no scan, because it reports
# success.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because a rule set that has learned a new provider's key format
    # should get to re-read history without waiting for someone to push.
    - cron: "17 4 * * 1"

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=gitleaks/gitleaks
  # Renovate cannot see a version held in a shell variable without being told
  # where to look, and a scanner pinned in a file nothing watches is a scanner
  # that quietly stops learning new key formats. It bumps the version; the
  # checksum below has to be updated in the same commit, and the fetch step
  # fails loudly rather than silently running an unverified binary if it is not.
  GITLEAKS_VERSION: "8.30.0"
  GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"

jobs:
  gitleaks:
    name: no secrets in the history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans commits, not the worktree. A shallow clone would
          # scan almost nothing and still pass.
          fetch-depth: 0

      - name: Fetch gitleaks
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan the full history
        shell: bash
        run: |
          set -euo pipefail
          # The whole history every time: it takes about three seconds here,
          # and scanning only the new commits would let a finding introduced
          # while a rule did not yet exist stay hidden forever.
          # --redact so a real finding does not get republished in the log of
          # a public repository, which would be the second disclosure.
          ./gitleaks git --no-banner --redact --exit-code 1 .

      - name: Scan the working tree
        shell: bash
        run: |
          set -euo pipefail
          # Catches anything reachable in the checkout that is not a committed
          # blob -- and fails on a submodule or generated file a history scan
          # would step over.
          ./gitleaks dir --no-banner --redact --exit-code 1 .
