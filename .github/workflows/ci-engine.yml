name: CI (engine)

# Split from the desktop suite so each half runs only when its own half of the
# tree changes. Two thirds of this repo's commits touch one side only, and a
# handful touch neither (docs, the packaging workflow) — under a single
# workflow every one of those booted both suites and paid for both.
#
# The path list must name this file too: a change to the workflow itself can
# break the run, and nothing else here would trigger it.
#
# It also names the handful of files OUTSIDE engine/ that engine tests assert
# against, because a path filter that omits them makes those tests unable to
# fire for the change they exist to catch. test_cli_name.py's CLI-name
# contract reads the desktop's spawn path, the package guard, the
# electron-builder copy path, the remote-engine hint and the release matrix; a
# packaging-only PR renaming the binary in any of them matches no other
# workflow at all, so without these lines it would merge having run no suite.
#
# test_license_contract.py is the second such reader, and the one whose inputs
# sit at the repository root: LICENSE, NOTICE, README.md, CONTRIBUTING.md and
# the desktop's package.json. Those five match no other workflow either -- an
# edit to the README's License section or a deleted LICENSE runs nothing at
# all, and package.json alone runs only ci-desktop, which cannot execute
# pytest.
#
# (Spelled out twice rather than shared through a YAML anchor: the workflow
# parser does not expand anchors.)
on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/ci-engine.yml"
      - ".github/workflows/package.yml"
      - "apps/desktop/electron-builder.yml"
      - "apps/desktop/electron/engine.ts"
      - "apps/desktop/scripts/check-engine.mjs"
      - "apps/desktop/src/lib/tools.ts"
      - "apps/desktop/src/screens/Settings.tsx"
      - "apps/desktop/package.json"
      - "LICENSE"
      - "NOTICE"
      - "README.md"
      - "CONTRIBUTING.md"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/ci-engine.yml"
      - ".github/workflows/package.yml"
      - "apps/desktop/electron-builder.yml"
      - "apps/desktop/electron/engine.ts"
      - "apps/desktop/scripts/check-engine.mjs"
      - "apps/desktop/src/lib/tools.ts"
      - "apps/desktop/src/screens/Settings.tsx"
      - "apps/desktop/package.json"
      - "LICENSE"
      - "NOTICE"
      - "README.md"
      - "CONTRIBUTING.md"

# A new push to a PR makes the previous run's result irrelevant — cancel it.
# NOT on main: every commit there needs its own verdict. All pushes to main
# share one ref, so blanket cancellation means two PRs merging a minute apart
# leave the first merge with no result at all, and a commit that broke the
# build carries no red mark.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege. This workflow only reads the tree; nothing here publishes,
# comments, or writes back. Matters more once the repo is public, where the
# default token grant is the difference between a compromised dependency
# being able to push and not.
permissions:
  contents: read

jobs:
  engine:
    # The matrix exists because the suite is otherwise only ever run on
    # whichever OS the author happens to be using — and a platform assumption
    # in a test reads exactly like a product defect until someone checks. Two
    # tests in this repo hardcoded POSIX behaviour (an extensionless `ffmpeg`,
    # POSIX mode bits) and looked like broken code on Windows for exactly
    # that reason.
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The suite runs in ~90s locally; brew/choco installing ffmpeg is the
    # slow part. Well clear of a normal run, but far below the 6h default —
    # a wedged render backend would otherwise burn a whole runner-day.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ---------------------------------------------------------------
        # Ubuntu only WHILE THE REPO IS PRIVATE.
        #
        # GitHub meters a private repo's Actions minutes with a per-OS
        # multiplier — macOS x10, Windows x2, Linux x1 — against 2,000 free
        # minutes a month. Measured across July 2026 that put 54% of the
        # entire monthly allowance into macOS jobs which ran for 99 real
        # minutes, and the account reached 90% of quota with three days left
        # in the cycle. A two-minute macOS job bills as twenty-one.
        #
        # RESTORE BOTH LINES THE DAY THE REPO GOES PUBLIC. Public repos get
        # unlimited free minutes on standard runners, so the multiplier stops
        # applying at all and there is no reason to test one platform. The
        # cross-platform coverage is the entire point of this matrix — see
        # the note on the job above. Tracked as a launch item alongside the
        # license decision in specs 07-roadmap-and-risks.md.
        # ---------------------------------------------------------------
        os: [ubuntu-latest]
        # os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # No floating v8/v9 major tag is published for this action, so the
        # exact release is pinned; bump it deliberately.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      # ONE ffmpeg source for every OS.
      #
      # Installing per-platform (apt / brew / choco) gave three builds with
      # three different feature sets, and Homebrew's ffmpeg formula carries
      # no libass, freetype, harfbuzz or fontconfig at all — so macOS had
      # neither `drawtext` nor a working `ass` filter, and burned-in captions
      # and on-screen titles failed there while passing everywhere else.
      # That is a property of the runner, not of this code, and it should
      # never have been able to differ by platform.
      #
      # This action serves BtbN builds on Linux/Windows and OSXExperts on
      # macOS arm64 — all full builds. Pinned to a commit SHA rather than a
      # tag: it is third-party, and a tag can be moved.
      - name: Install ffmpeg (identical build on every OS)
        uses: AnimMouse/setup-ffmpeg@0633f1f6ad34ac671f07224b3c89b00386f0c717 # v1.2.5

      - run: uv sync --all-groups

      - name: Verify ffmpeg has the filters the suite needs
        # Not just "is ffmpeg present". 18 assembly tests SKIP without ffmpeg
        # rather than failing, so a broken install reads as a green run that
        # quietly tested no assembly at all — and a build missing libass or
        # libfreetype fails three of them with errors that look like product
        # bugs. Assert the capability here, where the message can name it.
        shell: bash
        run: |
          set -euo pipefail
          echo "ffmpeg: $(command -v ffmpeg)"
          ffmpeg -hide_banner -version | head -1
          missing=()
          for filter in drawtext ass subtitles; do
            ffmpeg -hide_banner -filters 2>/dev/null | grep -qE "^ *[A-Z.]+ +${filter} " || missing+=("$filter")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::this ffmpeg lacks required filters: ${missing[*]} — it was built without libass/libfreetype/libharfbuzz, so burned-in captions and on-screen titles cannot render"
            exit 1
          fi
          echo "drawtext, ass and subtitles all present"

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # -rs prints the reason for every skip. A skip is a test that did not
      # run, and this suite skips rather than fails when a dependency is
      # absent — which is exactly how a runner with a crippled ffmpeg once
      # looked green while testing no assembly at all. What is NOT running
      # should be readable from the log without re-running anything.
      - run: uv run pytest -q -rs
