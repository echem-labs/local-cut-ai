name: CI (engine)

# Split from the desktop suite so each half runs only when its own half of the
# tree changes. Two thirds of this repo's commits touch one side only, and a
# handful touch neither (docs, the packaging workflow) — under a single
# workflow every one of those booted both suites and paid for both.
#
# The path list must name this file too: a change to the workflow itself can
# break the run, and nothing else here would trigger it.
#
# It also names the handful of files OUTSIDE engine/ that engine tests assert
# against, because a path filter that omits them makes those tests unable to
# fire for the change they exist to catch. test_cli_name.py's CLI-name
# contract reads the desktop's spawn path, the package guard, the
# electron-builder copy path, the remote-engine hint and the release matrix; a
# packaging-only PR renaming the binary in any of them matches no other
# workflow at all, so without these lines it would merge having run no suite.
#
# test_ui_contract.py is the other, and it reads the widest set: the engine's
# ids are pinned against the desktop's own source (bounds, unions, the client,
# the ETA and OOM helpers, two screens, two stylesheets, the rig's u7 walk),
# against its label catalogs, and against the committed voice previews. A PR
# that only renames a catalog key, edits one of those files or deletes a
# preview matches apps/desktop/** alone -- vitest and tsc, neither of which
# can run pytest. The catalogs and previews are named by directory because the
# module reads all of them; everything else is named file by file, and the
# module derives its own guard from the same list it reads, so a file added
# there turns that test red until these two lists carry it.
#
# test_license_contract.py is the second such reader, and the one whose inputs
# sit at the repository root: LICENSE, NOTICE, README.md, CONTRIBUTING.md and
# the desktop's package.json. Those five match no other workflow either -- an
# edit to the README's License section or a deleted LICENSE runs nothing at
# all, and package.json alone runs only ci-desktop, which cannot execute
# pytest. TRADEMARK.md, AGENTS.md and CLAUDE.md join them for the same reason:
# the test asserts the first two exist, that the README links TRADEMARK.md, and
# that AGENTS.md indexes CLAUDE.md's rules rather than restating them -- so a
# rule added to CLAUDE.md alone is a change this suite has to see.
#
# ci-desktop.yml is there for test_readme_contract.py too, and is the one
# entry here that names a file this workflow does not otherwise care about:
# the README states which platforms each suite runs on, and that sentence is
# reconciled against BOTH matrices. Narrowing the desktop matrix is a change
# to a claim the README makes, and it matches no other workflow that can run
# pytest.
#
# docs/** is the third, for test_readme_contract.py: those pages state the
# backend chain `local` expands to, the ComfyUI kind gate's default and the
# Node floor, each of which the engine also states somewhere. They match no
# other workflow at all, so without these lines a page edited into
# disagreement with the code would merge with nothing run -- and prose drifts
# in the direction that costs a reader most, by staying plausible.
#
# What is NOT here: the same module's whole-tree guard, which reads every
# tracked file. A path list cannot cover that input without naming the entire
# repository, so it runs unfiltered in repo-hygiene.yml instead. The root
# documents above are still listed here because the assertions about them are
# specific to those files, and this job is where the rest of the module runs.
#
# (Spelled out twice rather than shared through a YAML anchor: the workflow
# parser does not expand anchors. test_license_contract.py reads the two lists
# separately for that reason -- pooling them cannot see one falling behind the
# other, which is the only way hand-duplicated lists go wrong.)
on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/ci-engine.yml"
      - ".github/workflows/ci-desktop.yml"
      - ".github/workflows/package.yml"
      - "apps/desktop/electron-builder.yml"
      - "apps/desktop/electron/engine.ts"
      - "apps/desktop/scripts/check-engine.mjs"
      - "apps/desktop/src/lib/formats.ts"
      - "apps/desktop/src/lib/tools.ts"
      - "apps/desktop/src/lib/eta.ts"
      - "apps/desktop/src/lib/oom.ts"
      - "apps/desktop/src/api/client.ts"
      - "apps/desktop/src/api/types.ts"
      - "apps/desktop/src/screens/Home.tsx"
      - "apps/desktop/src/screens/Settings.tsx"
      - "apps/desktop/src/styles/app.css"
      - "apps/desktop/src/styles/tokens.css"
      - "apps/desktop/scripts/rig/u7.mjs"
      - "apps/desktop/src/i18n/en/**"
      - "apps/desktop/src/assets/voices/**"
      - "apps/desktop/package.json"
      - "LICENSE"
      - "NOTICE"
      - "README.md"
      - "CONTRIBUTING.md"
      - "TRADEMARK.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "SECURITY.md"
      - "docs/**"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/ci-engine.yml"
      - ".github/workflows/ci-desktop.yml"
      - ".github/workflows/package.yml"
      - "apps/desktop/electron-builder.yml"
      - "apps/desktop/electron/engine.ts"
      - "apps/desktop/scripts/check-engine.mjs"
      - "apps/desktop/src/lib/formats.ts"
      - "apps/desktop/src/lib/tools.ts"
      - "apps/desktop/src/lib/eta.ts"
      - "apps/desktop/src/lib/oom.ts"
      - "apps/desktop/src/api/client.ts"
      - "apps/desktop/src/api/types.ts"
      - "apps/desktop/src/screens/Home.tsx"
      - "apps/desktop/src/screens/Settings.tsx"
      - "apps/desktop/src/styles/app.css"
      - "apps/desktop/src/styles/tokens.css"
      - "apps/desktop/scripts/rig/u7.mjs"
      - "apps/desktop/src/i18n/en/**"
      - "apps/desktop/src/assets/voices/**"
      - "apps/desktop/package.json"
      - "LICENSE"
      - "NOTICE"
      - "README.md"
      - "CONTRIBUTING.md"
      - "TRADEMARK.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "SECURITY.md"
      - "docs/**"

# A new push to a PR makes the previous run's result irrelevant — cancel it.
# NOT on main: every commit there needs its own verdict. All pushes to main
# share one ref, so blanket cancellation means two PRs merging a minute apart
# leave the first merge with no result at all, and a commit that broke the
# build carries no red mark.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege. This workflow only reads the tree; nothing here publishes,
# comments, or writes back. Matters more once the repo is public, where the
# default token grant is the difference between a compromised dependency
# being able to push and not.
permissions:
  contents: read

jobs:
  engine:
    # The matrix exists because the suite is otherwise only ever run on
    # whichever OS the author happens to be using — and a platform assumption
    # in a test reads exactly like a product defect until someone checks. Two
    # tests in this repo hardcoded POSIX behaviour (an extensionless `ffmpeg`,
    # POSIX mode bits) and looked like broken code on Windows for exactly
    # that reason.
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The suite runs in ~90s locally; fetching ffmpeg is the slow part. Well
    # clear of a normal run, but far below the 6h default — a wedged render
    # backend would otherwise burn a whole runner-day.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # All three. A public repository's standard runners are unmetered on
        # every OS, so the extra legs cost wall-clock and nothing else — and
        # they run in parallel, so they cost little of that.
        #
        # README.md states this list in prose, and test_readme_contract.py
        # holds the two together: a leg dropped here without the sentence
        # being corrected promises a contributor coverage that is gone.
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # No floating v8/v9 major tag is published for this action, so the
        # exact release is pinned; bump it deliberately.
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      # ONE ffmpeg source for every OS.
      #
      # Installing per-platform (apt / brew / choco) gave three builds with
      # three different feature sets, and Homebrew's ffmpeg formula carries
      # no libass, freetype, harfbuzz or fontconfig at all — so macOS had
      # neither `drawtext` nor a working `ass` filter, and burned-in captions
      # and on-screen titles failed there while passing everywhere else.
      # That is a property of the runner, not of this code, and it should
      # never have been able to differ by platform.
      #
      # This action serves BtbN builds on Linux/Windows and OSXExperts on
      # macOS arm64 — all full builds. Pinned to a commit SHA rather than a
      # tag: it is third-party, and a tag can be moved.
      - name: Install ffmpeg (identical build on every OS)
        uses: AnimMouse/setup-ffmpeg@0633f1f6ad34ac671f07224b3c89b00386f0c717 # v1.2.5

      - run: uv sync --all-groups

      - name: Verify ffmpeg has the filters the suite needs
        # Not just "is ffmpeg present". The assembly tests SKIP without
        # ffmpeg rather than failing, so a broken install reads as a green run
        # that quietly tested no assembly at all — and a build missing libass or
        # libfreetype fails three of them with errors that look like product
        # bugs. Assert the capability here, where the message can name it.
        shell: bash
        run: |
          set -euo pipefail
          echo "ffmpeg: $(command -v ffmpeg)"
          ffmpeg -hide_banner -version | head -1
          missing=()
          for filter in drawtext ass subtitles; do
            ffmpeg -hide_banner -filters 2>/dev/null | grep -qE "^ *[A-Z.]+ +${filter} " || missing+=("$filter")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::this ffmpeg lacks required filters: ${missing[*]} — it was built without libass/libfreetype/libharfbuzz, so burned-in captions and on-screen titles cannot render"
            exit 1
          fi
          echo "drawtext, ass and subtitles all present"

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # -rs prints the reason for every skip. A skip is a test that did not
      # run, and this suite skips rather than fails when a dependency is
      # absent — which is exactly how a runner with a crippled ffmpeg once
      # looked green while testing no assembly at all. What is NOT running
      # should be readable from the log without re-running anything.
      - run: uv run pytest -q -rs
