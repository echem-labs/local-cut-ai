name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the previous run's result irrelevant — cancel it.
# NOT on main: every commit there needs its own verdict. All pushes to main
# share one ref, so blanket cancellation means two PRs merging a minute apart
# leave the first merge with no result at all, and a commit that broke the
# build carries no red mark.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege. This workflow only reads the tree; nothing here publishes,
# comments, or writes back. Matters more once the repo is public, where the
# default token grant is the difference between a compromised dependency
# being able to push and not.
permissions:
  contents: read

jobs:
  engine:
    # Every supported OS, because the suite is otherwise only ever run on
    # whichever one the author happens to be using — and a platform
    # assumption in a test reads exactly like a product defect until someone
    # checks. Two tests in this repo hardcoded POSIX behaviour (an
    # extensionless `ffmpeg`, POSIX mode bits) and looked like broken code
    # on Windows for exactly that reason.
    name: engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The suite runs in ~90s locally; brew/choco installing ffmpeg is the
    # slow part. Well clear of a normal run, but far below the 6h default —
    # a wedged render backend would otherwise burn a whole runner-day.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      # ffmpeg gates 18 assembly tests — the entire timeline/export layer.
      # Without it they SKIP rather than fail, so a CI run with no ffmpeg is
      # quietly not testing assembly at all.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - run: uv sync --all-groups

      - name: Verify ffmpeg is discoverable
        # Fail loudly here rather than silently skipping the assembly suite.
        run: uv run python -c "import shutil,sys; p=shutil.which('ffmpeg'); print('ffmpeg:',p); sys.exit(0 if p else 1)"

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # `build` also runs both tsc projects, so a renderer that typechecks
      # but cannot bundle still fails here.
      - run: npm run build
