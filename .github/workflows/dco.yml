name: DCO

# Contributions come in under a Developer Certificate of Origin rather than a
# CLA (CONTRIBUTING.md says why). The DCO is only a sign-off line, so it is
# only worth anything if something checks for it — an unenforced policy is
# discovered missing at the worst possible moment, which is when an outside
# contribution needs its provenance established after the fact.
#
# Pull requests only: this checks the commits a PR proposes, and there is
# nothing to gate on a push to main that has already merged.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sign-off:
    name: every commit is signed off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR's commits, not just the merge result — the sign-off is a
          # per-commit assertion. Depth 0 so the base is present to diff from.
          fetch-depth: 0

      - name: Check Signed-off-by on each commit
        shell: bash
        # The base branch arrives through the environment, not spliced into the
        # script body: `${{ }}` is substituted before bash parses the line, and
        # git permits `$`, a backtick and a quote in a ref name.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="origin/$BASE_REF"

          # Resolve the base explicitly. `git rev-list` inside a process
          # substitution cannot fail this step -- `set -e` and `pipefail` do not
          # see the exit status of `<(...)` -- so an unresolvable base fed the
          # loop nothing, `missing` stayed 0, and the job printed "all commits
          # signed off" having examined no commits at all. A DCO check that
          # passes vacuously is the exact failure this workflow exists to
          # prevent, so the range is materialised where a failure is fatal.
          git rev-parse --verify --quiet "$base^{commit}" > /dev/null || {
            echo "::error::cannot resolve base ref '$base' - nothing was checked"
            exit 1
          }
          # --no-merges: a merge commit carries the sign-offs of what it merges.
          shas=$(git rev-list --no-merges "$base..HEAD")

          missing=0
          checked=0
          # A sign-off has to BE a trailer and has to NAME the person who wrote
          # the commit. `%(trailers:...)` reads only the message's trailer
          # block, so a sign-off quoted in the middle of a body no longer
          # counts, and comparing the value against the author (and against the
          # committer, so a rebase or a patch applied on someone's behalf still
          # passes) is what makes the trailer an assertion rather than a
          # decoration -- a trailer naming a third party certifies nothing
          # about the person submitting it.
          #
          # What this does NOT catch, despite the temptation to claim it:
          # `git cherry-pick` and `git am` both preserve the author, so an
          # upstream sign-off travels with the very author it names and matches.
          # Carrying someone else's patch still needs your own `-s` on top; the
          # gate that would enforce it is the committer, and the committer is
          # set by the same person as the trailer.
          #
          # The shape is still required alongside the identity: equality alone
          # accepts `x <x>` whenever `user.email` is spelled that way too, and
          # naming a contactable identity was the one real property of the
          # `.+ <.+@.+>` pattern this replaced.
          ident='^.+ <.+@.+>$'
          for sha in $shas; do
            checked=$((checked + 1))
            # Materialised into a variable, not read through `<(...)`: a process
            # substitution's exit status is invisible to `set -e` and `pipefail`
            # alike -- see the base-ref note above -- and a `git log` that died
            # here would read as a commit carrying no sign-off at all. It also
            # keeps `git log` out of a pipeline, which is what the SIGPIPE bug
            # this loop used to have was made of: `grep -q` exits on its first
            # match, `git log` then dies with 141, `pipefail` promotes that to
            # the pipeline's status, and a message past the 64 KiB pipe buffer
            # was reported as unsigned precisely because it *was* signed off.
            #
            # `unfold` joins a trailer split across continuation lines. Without
            # it `mapfile` splits one value into two, neither of which can ever
            # equal an ident.
            signers=$(git log -1 --format='%(trailers:key=Signed-off-by,valueonly,unfold)' "$sha")
            author=$(git log -1 --format='%an <%ae>' "$sha")
            committer=$(git log -1 --format='%cn <%ce>' "$sha")
            mapfile -t signer_lines <<< "$signers"
            signed=0
            shopt -s nocasematch
            for signer in "${signer_lines[@]}"; do
              [[ "$signer" =~ $ident ]] || continue
              if [[ "$signer" == "$author" || "$signer" == "$committer" ]]; then
                signed=1
              fi
            done
            shopt -u nocasematch
            if [ "$signed" -eq 0 ]; then
              subject=$(git log -1 --format='%s' "$sha")
              # A bare CR in a subject is passed through by git, and the runner
              # splits its stdout on CR as well as LF - so an unsigned commit
              # from a fork could emit its own `::` workflow commands here,
              # including `::stop-commands::` to blank the real annotations.
              # The author reaches the same line and is just as much the
              # submitter's to choose: git strips only `\n`, `<` and `>` from an
              # ident, and a CR in the middle of a name survives verbatim. Every
              # value that reaches an annotation gets the same scrub.
              subject=${subject//[$'\r\n']/ }
              author=${author//[$'\r\n']/ }
              echo "::error::${sha:0:8} \"$subject\" has no Signed-off-by trailer naming its author ($author)"
              missing=1
            fi
          done

          # An empty range is the other way this passes having checked nothing:
          # a PR whose commits already landed on the base, or whose only content
          # is a merge. `checked` was counted for the message and never asserted.
          if [ "$checked" -eq 0 ]; then
            echo "::error::no commits were examined in $base..HEAD - refusing to report a pass"
            exit 1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Sign off with 'git commit -s' (amend with 'git commit -s --amend', or"
            echo "rebase with 'git rebase --signoff $base'). The line has to name"
            echo "the commit's own author, and has to sit in the message's last"
            echo "paragraph - a trailer, not a line quoted in the body. See"
            echo "CONTRIBUTING.md."
            exit 1
          fi
          echo "all $checked commits signed off"
