# Remote engine on a GPU box: the headless LocalCut engine plus the Ollama
# it uses for scripts and natural-language edits. Start it, read the pairing
# code from `docker compose logs engine`, and paste it into the desktop
# app's Settings → Remote engine.
#
#   LOCALCUT_TOKEN="$(openssl rand -base64 32)" \
#     LOCALCUT_ADVERTISE=gpu-box.local docker compose up -d
#
# ComfyUI (keyframes/clips/music) is intentionally not declared here: GPU
# ComfyUI setups are personal (custom nodes, model paths, quant choices).
# Run yours on the host or as your own container and point the engine at it
# with LOCALCUT_COMFYUI_URL; without one, those node kinds fall back to the
# mock backend so the pipeline still runs end to end.

services:
  engine:
    build: ../engine
    restart: unless-stopped
    environment:
      LOCALCUT_TOKEN: ${LOCALCUT_TOKEN:?set LOCALCUT_TOKEN to a long random pairing token}
      LOCALCUT_BACKEND: ${LOCALCUT_BACKEND:-local,mock}
      LOCALCUT_LLM_URL: http://ollama:11434/v1
      # Not set here, so the script model is Auto: the one the hardware
      # recommendation fits to this box's GPU, qwen3:8b on an 8 GB card and
      # qwen3:14b from 10 GB, which is also what the first-run screen tells
      # you to pull. To use one model whatever the card, export
      # LOCALCUT_LLM_MODEL=qwen3:14b (or any model Ollama has) before
      # `docker compose up`; with no value here it is passed through from
      # your shell when set there, and left out of the container when not.
      LOCALCUT_LLM_MODEL:
      LOCALCUT_COMFYUI_URL: ${LOCALCUT_COMFYUI_URL:-http://host.docker.internal:8188}
      # What the pairing code tells the laptop to dial. Without it the engine
      # advertises its own outbound address, which inside a container is the
      # bridge network (172.x) and reaches nothing — and the pairing code is
      # opaque base64, so there is no correcting it by hand. Set this to the
      # GPU box's LAN address, tailnet name, or proxy host:port.
      LOCALCUT_ADVERTISE: ${LOCALCUT_ADVERTISE:?set LOCALCUT_ADVERTISE to the address your laptop dials this box on}
    volumes:
      - localcut-data:/data
    ports:
      - "7830:7830"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ollama
    # The engine renders nothing on the GPU itself. It is given the card so
    # its hardware probe (nvidia-smi, which the NVIDIA runtime mounts in) can
    # see it. Without that the probe finds no GPU, Auto falls back to
    # qwen3:14b whatever the card, and the first-run screen offers no local
    # model for scripts, keyframes, clips or music.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    # Pinned for the same reason the engine's FFmpeg is: this box is
    # network-exposed, and a floating tag is unverified code on every pull.
    image: ollama/ollama:0.33.3
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  localcut-data:
  ollama:
