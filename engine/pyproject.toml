[project]
name = "localcut-engine"
version = "0.1.0"
description = "LocalCut AI engine — Python orchestrator: story graph, job queue, model manager, provider adapters"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.13.4",
    "httpx>=0.28.1",
    "websockets>=16.1",
    "psutil>=7.2.0",
    "kokoro-onnx>=0.5.0",
    "soundfile>=0.14.0",
]

[project.scripts]
localcut-engine = "localcut_engine.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localcut_engine"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
