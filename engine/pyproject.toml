[project]
name = "localcut-engine"
version = "0.1.0"
description = "LocalCut AI engine — Python orchestrator: story graph, job queue, model manager, provider adapters"
# 3.14 at least: setting up LocalCut's own Ollama on Linux unpacks a
# .tar.zst, which tarfile reads only from 3.14 on (compression.zstd), and
# 3.14 is what CI tests and the packaged engine runs.
# Capped below 3.15 because ctranslate2 (under faster-whisper) publishes no
# cp315 wheels and no sdist. Without the cap, uv on a machine with no 3.14
# downloads the newest CPython and then cannot install it, which is how
# every Linux CI job broke when 3.15.0 came out. Lift it and re-run `uv lock`
# once ctranslate2 ships 3.15 wheels.
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.13.4",
    "httpx>=0.28.1",
    "websockets>=16.1",
    "psutil>=7.2.0",
    "kokoro-onnx>=0.5.0",
    "soundfile>=0.14.0",
    "faster-whisper>=1.2.1",
    "cryptography>=49.0.0",
    "mcp>=2.0.0",
]

[project.scripts]
localcut = "localcut_engine.cli:main"

[dependency-groups]
build = [
    "pyinstaller>=6.21.0",
]
dev = [
    # pre-commit drives the repo-root hooks, which cover the desktop half too.
    # It lives here rather than in a second manifest because this is already
    # the only lockfile that pins ruff, and the hooks run that same ruff.
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localcut_engine"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  # Tests that inspect the PyInstaller artifact rather than the checkout.
  # `package.yml` selects them with `-m freeze`, because it is the only job
  # where the freeze exists and it runs on all three platforms - where the
  # rest of test_license_boundaries.py, whose inventories are POSIX-spelled
  # and Linux-only, cannot pass.
  "freeze: needs a built freeze; selected by the packaging workflow",
]
